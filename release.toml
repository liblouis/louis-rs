# Before `cargo release <level>`, run `cargo semver-checks -p louis-rs` to pick the level:
# if it reports breaking ("major") changes, a 0.x release has to be `minor`, not `patch`.
pre-release-replacements = [
  {file="CHANGELOG.md", search="Unreleased", replace="{{version}}"},
  {file="CHANGELOG.md", search="\\.\\.\\.HEAD", replace="...{{tag_name}}", exactly=1},
  {file="CHANGELOG.md", search="ReleaseDate", replace="{{date}}"},
  {file="CHANGELOG.md", search="<!-- next-header -->", replace="<!-- next-header -->\n\n## [Unreleased] - ReleaseDate", exactly=1},
  {file="CHANGELOG.md", search="<!-- next-url -->", replace="<!-- next-url -->\n[Unreleased]: https://github.com/liblouis/louis-rs/compare/{{tag_name}}...HEAD", exactly=1},
]

[workspace]
members = ["louis-cli"]
default-members = [".", "louis-cli"]

[workspace.package]
version = "0.3.1"

[package]
name = "louis-rs"
version.workspace = true
edition = "2024"
description = "A pure Rust re-implementation of the liblouis braille translator and back-translator"
repository = "https://github.com/liblouis/louis-rs"
readme = "README.md"
license = "LGPL-2.1-or-later"
keywords = ["braille", "liblouis", "accessibility"]
categories = ["accessibility", "text-processing"]
include = ["src/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
name = "louis"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
search_path = "0.1.4"
enumset = "1.1.3"
log = "0.4.21"
smallvec = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "translate"
harness = false

[[bench]]
name = "parse_and_compile"
harness = false
